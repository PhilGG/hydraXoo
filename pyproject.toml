[project]
name = "hydraxoo"
version = "0.2.1"
description = "Zone-based irrigation scheduling for Home Assistant"
license = "MIT"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # line length is handled by the formatter
