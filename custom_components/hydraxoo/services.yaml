run_zone:
  fields:
    zone:
      required: true
      selector:
        device:
          integration: hydraxoo
    duration:
      required: false
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
          mode: box

stop_zone:
  fields:
    zone:
      required: true
      selector:
        device:
          integration: hydraxoo

stop_all:

pause:
  fields:
    days:
      required: false
      selector:
        number:
          min: 1
          max: 365
          unit_of_measurement: d
          mode: box

resume:

acknowledge_fault:
  fields:
    zone:
      required: true
      selector:
        device:
          integration: hydraxoo
